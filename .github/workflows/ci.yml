name: documentation-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required Lab 05 documents
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/architecture.png
          test -f docs/tech-stack-summary.md
          test -f docs/comparison-matrix.md
          test -f docs/adr/ADR-001-fitflow-stack.md
